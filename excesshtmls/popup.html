<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup Example</title>
  <style>
    /* Popup styles */
    .popup {
      display: none; /* Initially hidden */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */

      align-items: center;
      justify-content: center;
    }

    .popup-content {
      background-color: #e8f0fe;
      background-image: url("/websites/active-1.0.0/active-1.0.0/assets/img/papers/paper-3.png");
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 500px;
      width: 80%;
    }

    .popup-image {
      max-width: 100%;
      height: auto;
    }

    .close-btn {
      position: relative;
      top: -20px;
      right: -250px;
      font-size: 30px;
      cursor: pointer;
    }
    #close-btn{

    }
  </style>
</head>
<body>

  <!-- Popup container -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <div id="close-btn" class="close-btn">&times;</div>
      <img src="assets/img/brand-point-logo-w-title.png" alt="Image" class="popup-image" width="150px">
      <h2>This is your popup!</h2>
      <p>Here is some text describing the popup content.</p>
    </div>
  </div>

        popup.style.display = 'none';
      };

      // Automatically open the popup after 30 seconds
     setTimeout(function() {
