<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Layouts</title>
    <style>
        /* General popup style */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
        }

        /* 2 by 5 Popup */
        #popup-2by5 .popup-content {
            flex-wrap: wrap;
            justify-content: space-around;
            max-width: 800px;
        }
        #popup-2by5 .popup-content div {
            width: 48%;
            height: 100px;
            background-color: #f0f0f0;
        }

        /* 2 by 4 Popup */
        #popup-2by4 .popup-content {
            flex-wrap: wrap;
            justify-content: space-around;
            max-width: 800px;
        }
        #popup-2by4 .popup-content div {
            width: 48%;
            height: 120px;
            background-color: #e0e0e0;
        }

        /* 2 by 3 Popup */
        #popup-2by3 .popup-content {
            flex-wrap: wrap;
            justify-content: space-around;
            max-width: 800px;
        }
        #popup-2by3 .popup-content div {
            width: 48%;
            height: 160px;
            background-color: #d0d0d0;
        }

        /* 2 by 2 Popup with vertical and horizontal images */
        #popup-2by2 .popup-content {
            display: flex;
            justify-content: space-between;
            max-width: 800px;
        }

        #popup-2by2 .popup-content .image-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 48%;
        }

        #popup-2by2 .popup-content .image-container img {
            max-width: 100%;
        }

        /* Image sizes */
        #popup-2by2 .popup-content .image-container.vertical img {
            height: 480px;
        }

        #popup-2by2 .popup-content .image-container.horizontal img {
            width: 640px;
        }

        /* Close button */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
        }

        /* Display popup styles */
        .show {
            display: flex;
        }

    </style>
</head>
<body>

    <!-- 2 by 5 Popup -->
    <div id="popup-2by5" class="popup">
        <div class="popup-content">
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>

        </div>
        <button class="close-btn" onclick="closePopup('popup-2by5')">X</button>
    </div>

    <!-- 2 by 4 Popup -->
    <div id="popup-2by4" class="popup">
        <div class="popup-content">
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
        </div>
        <button class="close-btn" onclick="closePopup('popup-2by4')">X</button>
    </div>

    <!-- 2 by 3 Popup -->
    <div id="popup-2by3" class="popup">
        <div class="popup-content">
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
        </div>
        <button class="close-btn" onclick="closePopup('popup-2by3')">X</button>
    </div>

    <!-- 2 by 2 Popup with images -->
    <div id="popup-2by2" class="popup">
        <div class="popup-content">
            <div class="image-container vertical">
                <img src="assets/img/id-cards/id-card1.png" alt="Vertical Image">
            </div>
            <div class="image-container horizontal">
                <img src="assets/img/business-cards/canva-pfeIsBbuH7k.jpg" alt="Horizontal Image">
            </div>
        </div>
        <button class="close-btn" onclick="closePopup('popup-2by2')">X</button>
    </div>

    <script>
        // Function to open the popup by ID
        function openPopup(popupId) {
            document.getElementById(popupId).classList.add('show');
        }

        // Function to close the popup by ID
        function closePopup(popupId) {
            document.getElementById(popupId).classList.remove('show');
        }
    </script>

    <!-- Example buttons to trigger popups -->
    <button onclick="openPopup('popup-2by5')">Open 2by5 Popup</button>
    <button onclick="openPopup('popup-2by4')">Open 2by4 Popup</button>
    <button onclick="openPopup('popup-2by3')">Open 2by3 Popup</button>
    <button onclick="openPopup('popup-2by2')">Open 2by2 Popup</button>

</body>
</html>
