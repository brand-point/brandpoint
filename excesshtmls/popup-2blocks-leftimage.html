<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continuous Popup with 2 Blocks (Images Left, Text Right)</title>
  <style>
    /* Popup styles */
    .popup {
      display: none; /* Initially hidden */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
      align-items: center;
      justify-content: center;
    }

    .popup-content {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2 columns layout */
      gap: 20px;
      max-width: 800px;
      width: 90%;
    }

    .popup-block {
      display: flex;
      align-items: center; /* Vertically align items in the center */
      gap: 20px; /* Space between image and text */
      padding: 20px;
      border: 2px solid #ccc;
      border-radius: 10px;
      text-align: left; /* Align text to the left */
    }

    .popup-block img {
      max-width: 150px;
      height: auto;
      border-radius: 10px;
    }

    .popup-block h3 {
      margin-top: 10px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Popup container -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <span id="close-btn" class="close-btn">&times;</span>
      
      <!-- Block 1 -->
      <div class="popup-block">
        <img src="assets/img/id-cards/id-card1.png" alt="Image 1">
        <div>
          <h3>Block 1</h3>
          <p>This is some text for Block 1. The image is on the left, and the text is on the right.</p>
        </div>
      </div>

      <!-- Block 2 -->
      <div class="popup-block">
        <img src="assets/img/id-cards/id-card1.png" alt="Image 2">
        <div>
          <h3>Block 2</h3>
          <p>This is some text for Block 2. Again, the image is on the left, and the text is on the right.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.onload = function() {
      const popup = document.getElementById('popup');
      const closeButton = document.getElementById('close-btn');

      // Close popup when the close button is clicked
      closeButton.onclick = function() {
        popup.style.display = 'none';
      };

      // Automatically open the popup after 30 seconds
     setTimeout(function() {
        popup.style.display = 'flex';
      }, 1000); // 30,000 milliseconds = 30 seconds

      // Automatically close popup after another 30 seconds
    /*   setTimeout(function() {
        popup.style.display = 'none';
      }, 20000); // 60,000 milliseconds = 60 seconds (30 seconds after opening) */



    };
  </script>

</body>
</html>
