<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e8f0fe;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 20px;
            background-color: #e8f0fe;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            border: 2px dashed; #fff;
        }

        .container h1 {
            font-size: 50px;
            color: #000000;
            margin: 0;
        }

        .container h2 {
            font-size: 24px;
            margin: 20px 0;
        }

        .container p {
            font-size: 18px;
            color: #000000;
            margin: 0;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 16px;
            background-color: #e8f0fe;
            color: #000000;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 30px;
            transition: background-color 0.3s;
             border: 2px solid #000000;
        }

        .btn:hover {
            background-color: #000000;
            color: #ffffff;
           
        }

        .illustration {
            width: 150px;
            height:40px;
            margin-top: 20px;
            margin-bottom: 20px;
            /* background: url('assets/img/brand-point-logo-w-title.png') no-repeat center center; */
            background-size: cover;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="illustration"><img src="assets/img/brand-point-logo-w-title.png" width="150" height="40"></div>
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>
        <p>We couldn’t find the page you’re looking for. It might have been moved, deleted, or may be under construction.</p>
        <a href="index.html" class="btn">Back to Brand Point</a>
    </div>

</body>
</html>
