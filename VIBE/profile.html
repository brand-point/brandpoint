<!DOCTYPE html>
<html>
<head>
<title>Profile</title>
<style>
  body { font-family:Segoe UI, sans-serif; background:#f6f8fb; margin:0; padding:40px; }
  .card {
    background:#fff; padding:24px; border-radius:12px;
    max-width:400px; margin:auto;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
  }
  h2 { margin-top:0; }
  .row { margin-bottom:14px; }
  label { font-size:14px; color:#555; }
  input {
    width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px;
  }
  #backBtn {
    background:#2563eb; color:#fff; border:none;
    padding:10px 16px; border-radius:8px; cursor:pointer;
    margin-top:14px; width:100%;
  }
</style>
</head>
<body>

<script>
  // Protect Profile Page
  if (localStorage.getItem("brioLoggedIn") !== "true") {
    window.location.href = "login.html";
  }
</script>

<div class="card">
  <h2>Profile Details</h2>

  <div class="row">
    <label>Name</label>
    <input type="text" value="Brio User" readonly>
  </div>

  <div class="row">
    <label>Email</label>
    <input type="text" value="test@briotech.com" readonly>
  </div>

  <div class="row">
    <label>Mobile Number</label>
    <input type="text" value="9381655363" readonly>
  </div>

  <div class="row">
    <label>Change Password (optional)</label>
    <input type="password" placeholder="Enter new password">
  </div>

  <button id="backBtn">Back to Dashboard</button>
</div>

<script>
document.getElementById("backBtn").onclick = ()=> window.location.href = "dash-board.html";
</script>

</body>
</html>
