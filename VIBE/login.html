<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brio Login</title>

<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #f6f8fb;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .login-box {
    background: #fff;
    width: 360px;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    text-align: center;
    transition: 0.2s;
  }

  .login-box img {
    height: 60px;
    margin-bottom: 18px;
  }

  .login-box h2 {
    margin-bottom: 22px;
    font-weight: 600;
    color: #111;
    text-align: left;
  }

  .form-group {
    margin-bottom: 14px;
    text-align: left;
  }

  .form-group label {
    font-size: 14px;
    margin-bottom: 6px;
    color: #555;
    display: block;
  }

  .form-group input {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    outline: none;
    transition: border 0.2s;
  }

  .form-group input:focus {
    border-color: #2563eb;
  }

  .btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    border: none;
    font-size: 15px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 8px;
    transition: 0.25s;
  }

  .btn:hover {
    background: linear-gradient(135deg, #1d4ed8, #1e40af);
  }

  .extra-row {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 14px;
  }

  .extra-row a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
  }

  .signup {
    text-align: center;
    margin-top: 14px;
    font-size: 14px;
  }

  .signup a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
  }

  #errorMsg {
    color: #dc2626;
    font-size: 14px;
    margin-top: 10px;
    display: none;
  }

  /* Shake Animation */
  .shake {
    animation: shake 0.3s linear;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
</style>

</head>
<body>

<div class="login-box" id="loginBox">

  <!-- Brio Logo -->
  <img src="https://www.briotech.com/wp-content/uploads/2022/05/brio-black-1.svg" alt="Brio">

  <h2>Login</h2>

  <div class="form-group">
    <label>Email / Mobile Number</label>
    <input type="text" id="userInput" placeholder="Enter email or mobile number" value="test@briotech.com">
  </div>

  <div class="form-group">
    <label>Password</label>
    <div style="position: relative;">
      <input type="password" id="passwordInput" placeholder="Enter password" value="1234">
      <span id="togglePassword" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:14px; color:#666;">
        👁️
      </span>
    </div>
  </div>

  <div class="extra-row">
    <label><input type="checkbox" id="rememberMe"> Remember me</label>
    <a href="#">Forgot Password?</a>
  </div>

  <button class="btn" id="loginBtn">Login</button>

  <p id="errorMsg">Entered details are wrong. Please check and login again.</p>

  <div class="signup">
    Don’t have an account? <a href="#">Signup</a>
  </div>

</div>

<script>
/* Show/Hide Password */
document.getElementById("togglePassword").addEventListener("click", function(){
  const passInput = document.getElementById("passwordInput");
  passInput.type = passInput.type === "password" ? "text" : "password";
});

/* Login Validation + Redirect */
document.getElementById("loginBtn").addEventListener("click", function(){
  const user = document.getElementById("userInput").value.trim();
  const pass = document.getElementById("passwordInput").value.trim();
  const errorMsg = document.getElementById("errorMsg");
  const box = document.getElementById("loginBox");

  const validEmail = "test@briotech.com";
  const validMobile = "9381655363";
  const validPass = "1234";

  if ((user === validEmail || user === validMobile) && pass === validPass) {
    errorMsg.style.display = "none";

    if (document.getElementById("rememberMe").checked) {
      localStorage.setItem("brioLoggedIn", "true");
    }

    window.location.href = "dash-board.html";
  } else {
    errorMsg.style.display = "block";
    box.classList.remove("shake");
    void box.offsetWidth;
    box.classList.add("shake");
  }
});
</script>

</body>
</html>
