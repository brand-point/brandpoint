<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup with Uneven Blocks and Images</title>
  <style>
    /* General styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #f0f0f0;
    }

    /* Popup container */
    .popup {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      text-align: center;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 90%; /* Ensure it doesn't exceed screen width */
      max-height: 90vh; /* Ensure it doesn't exceed screen height */
      overflow-y: auto; /* Add scroll if content overflows */
      display: none; /* Hide popup by default */
    }

    /* Close button */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #ff4d4d;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      background-color: #ff1a1a;
    }

    /* Grid container for blocks */
    .blocks-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    /* Individual blocks */
    .block {
      background-color: #f0f0f0;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
    }

    /* Block images */
    .block img {
      max-width: 100%; /* Ensure images don't overflow their container */
      height: auto;
      border-radius: 5px;
    }

    /* Block text */
    .block p {
      margin: 5px 0 0;
      font-size: 14px;
      color: #333;
    }

    /* Uneven block sizes */
    .block:nth-child(1) {
      grid-column: span 2;
      grid-row: span 1;
    }
    .block:nth-child(2) {
      grid-column: span 1;
      grid-row: span 2;
    }
    .block:nth-child(3) {
      grid-column: span 1;
      grid-row: span 1;
    }
    .block:nth-child(4) {
      grid-column: span 1;
      grid-row: span 1;
    }
    .block:nth-child(5) {
      grid-column: span 1;
      grid-row: span 1;
    }
    .block:nth-child(6) {
      grid-column: span 1;
      grid-row: span 1;
    }
    .block:nth-child(7) {
      grid-column: span 2;
      grid-row: span 1;
    }
    .block:nth-child(8) {
      grid-column: span 1;
      grid-row: span 1;
    }
    .block:nth-child(9) {
      grid-column: span 1;
      grid-row: span 1;
    }
    .block:nth-child(10) {
      grid-column: span 1;
      grid-row: span 1;
    }
    .block:nth-child(11) {
      grid-column: span 2;
      grid-row: span 1;
    }
  </style>
</head>
<body>
  <!-- Popup -->
  <div class="popup" id="popup">
    <!-- Close button -->
    <button class="close-btn" id="close-btn">&times;</button>
    <!-- Blocks container -->
    <div class="blocks-container">
      <!-- Block 1 -->
      <div class="block">
        <img src="../assets/img/brand-point-logo-w-title.png" alt="Image 1">
        <p>Text 1</p>
      </div>
      <!-- Block 2 -->
      <div class="block">
        <img src="../assets/img/brand-point-logo-w-title.png" alt="Image 2">
        <p>Text 2</p>
      </div>
      <!-- Block 3 -->
      <div class="block">
        <img src="../assets/img/brand-point-logo-w-title.png" alt="Image 3">
        <p>Text 3</p>
      </div>

      <!-- Block 4 -->
      <div class="block">
        <img src="../assets/img/brand-point-logo-w-title.png" alt="Image 4">
        <p>Text 4</p>
      </div>
      <!-- Block 5 -->
      <div class="block">
        <img src="../assets/img/brand-point-logo-w-title.png" alt="Image 5">
        <p>Text 5</p>
      </div>
      <!-- Block 6 -->
      <div class="block">
        <img src="../assets/img/brand-point-logo-w-title.png" alt="Image 6">
        <p>Text 6</p>
      </div>
      <!-- Block 7 -->
      <div class="block">
        <img src="../assets/img/brand-point-logo-w-title.png" alt="Image 6">
        <p>Text 7</p>
      </div>
      <!-- Block 8 -->
      <div class="block">
        <img src="../assets/img/brand-point-logo-w-title.png" alt="Image 7">
        <p>Text 8</p>
      </div>
      <!-- Block 9 -->
      <div class="block">
        <img src="../assets/img/brand-point-logo-w-title.png" alt="Image 8">
        <p>Text 9</p>
      </div>
      <!-- Block 10 -->
      <div class="block">
        <img src="../assets/img/brand-point-logo-w-title.png" alt="Image 9">
        <p>Text 10</p>
      </div>
      <!-- Block 11 -->
      <div class="block">
        <img src="../assets/img/brand-point-logo-w-title.png" alt="Image 10">
        <p>Text 11</p>
      </div>
      <!-- Block 12 -->
      <div class="block">
        <img src="../assets/img/brand-point-logo-w-title.png" alt="Image 11">
        <p>Text 12</p>
      </div>
    </div>
  </div>

  <script>
    // JavaScript to handle the close button and auto-popup
    const popup = document.getElementById('popup');
    const closeBtn = document.getElementById('close-btn');

    // Function to show the popup after 30 seconds
    setTimeout(() => {
      popup.style.display = 'block';
    }, 30000); // 30 seconds in milliseconds

    // Function to close the popup
    closeBtn.addEventListener('click', () => {
      popup.style.display = 'none';
    });
  </script>
</body>
</html>
