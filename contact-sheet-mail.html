<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Form → Google Sheet + Email</title>
  <style>
    :root { --bg:#0b1020; --card:#131a33; --muted:#a7b0c7; --text:#e8ecf7; --accent:#6aa5ff; --accent2:#8dd39e; }
    * { box-sizing:border-box; }
    body {
      margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:radial-gradient(1200px 800px at 20% -20%, #1b254d 0%, #0b1020 60%, #060913 100%);
      color:var(--text); display:grid; place-items:center; min-height:100dvh; padding:24px;
    }
    .wrap { width:100%; max-width:680px; }
    .card {
      background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
      border-radius:18px; padding:24px 22px;
      backdrop-filter: blur(10px);
    }
    h1 { margin:0 0 6px; font-weight:700; letter-spacing:.3px; }
    p.sub { margin:0 0 18px; color:var(--muted); font-size:14px }
    form { display:grid; gap:14px; }
    .row { display:grid; gap:12px; grid-template-columns:1fr 1fr; }
    @media (max-width:640px){ .row { grid-template-columns:1fr; } }
    label { font-size:13px; color:var(--muted); display:block; margin-bottom:6px; }
    input, textarea, button {
      width:100%; border-radius:12px; border:1px solid rgba(255,255,255,0.14);
      background:#0f1530; color:var(--text); padding:12px 14px; font-size:15px;
      outline:none; transition:border .15s ease, box-shadow .15s ease;
    }
    input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(106,165,255,.18); }
    textarea { min-height:120px; resize:vertical; }
    .error { color:#ff8e8e; font-size:12px; margin-top:6px; display:none; }
    .invalid input, .invalid textarea { border-color:#ff6b6b !important; }
    .hint { font-size:12px; color:var(--muted); margin-top:6px }
    button {
      background:linear-gradient(135deg, var(--accent), #9bc2ff);
      color:#04122d; font-weight:700; letter-spacing:.3px; cursor:pointer; border:none;
    }
    button[disabled] { opacity:.6; cursor:not-allowed; }
    .status {
      margin-top:14px; font-size:14px; display:none; padding:10px 12px; border-radius:12px;
      border:1px solid rgba(255,255,255,0.12);
    }
    .ok { background:rgba(141,211,158,.1); color:var(--accent2); display:block; }
    .bad { background:rgba(255,107,107,.1); color:#ff9f9f; display:block; }
    .req { color:#ffb86b; font-weight:600; }
    .fineprint { margin-top:10px; font-size:12px; color:var(--muted) }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Contact us</h1>
      <p class="sub">Fill the form—your message lands in our Google Sheet and we’ll also get an email.</p>

      <form id="contactForm" novalidate>
        <!-- Name -->
        <div class="field" id="f-name">
          <label for="name">Name <span class="req">*</span></label>
          <input id="name" name="name" type="text" placeholder="Your full name" required
                 autocomplete="name" />
          <div class="error">Please enter your name.</div>
        </div>

        <!-- Row: Mobile + Email -->
        <div class="row">
          <!-- Mobile -->
          <div class="field" id="f-mobile">
            <label for="mobile">Mobile number <span class="req">*</span></label>
            <input id="mobile" name="mobile" type="tel" placeholder="10-digit mobile number" required
                   inputmode="numeric" maxlength="10" autocomplete="tel"
                   pattern="^[0-9]{10}$" />
            <div class="hint">Numbers only, exactly 10 digits.</div>
            <div class="error">Enter a valid 10-digit number (digits only).</div>
          </div>

          <!-- Email -->
          <div class="field" id="f-email">
            <label for="email">Email ID <span class="req">*</span></label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required
                   autocomplete="email" />
            <div class="error">Please enter a valid email address.</div>
          </div>
        </div>

        <!-- Message -->
        <div class="field" id="f-message">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="How can we help?"></textarea>
        </div>

        <button id="submitBtn" type="submit">Submit me</button>

        <div id="status" class="status" role="status" aria-live="polite"></div>
        <p class="fineprint">By submitting, you agree to be contacted on the provided details.</p>
      </form>
    </div>
  </div>

  <script>
const $form = document.querySelectorAll("#contactForm");

$form[0].addEventListener("submit", function(e) {
  e.preventDefault();

  // get field values using $form[0].querySelector
  const name = $form[0].querySelector("#name").value.trim();
  const mobile = $form[0].querySelector("#mobile").value.trim();
  const email = $form[0].querySelector("#email").value.trim();
  const message = $form[0].querySelector("#message").value.trim();

  const data = { name, mobile, email, message };
  const status = document.getElementById("status");
  status.textContent = "Submitting...";
  
  fetch("https://script.google.com/macros/s/AKfycbzZon7Dn9_GYbDrBaTlO24aqusK7el7jlan_NWEpR5cJJ3af7KzNpeNi7AXusvyCFe-Xg/exec", {
    method: "POST",
    body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" }
  })
  .then(res => res.json())
  .then(response => {
    if (response.result === "success") {
      status.textContent = "✅ Thank you! Redirecting...";

      // clear form
      $form[0].reset();

      // pass submitted values to thank-you page (optional)
      const params = new URLSearchParams({
        name: name,
        mobile: mobile,
        email: email
      });

      // Redirect to thank-you page after short delay
      setTimeout(() => {
        window.location.href = "https://brandpoint.in/thank-you.html?" + params.toString();
      }, 800); // 0.8 seconds
    } else {
      status.textContent = "❌ Error submitting form. Try again.";
    }
  })
  .catch(err => {
    status.textContent = "⚠️ Network error. Please try later.";
    console.error(err);
  });
});
</script>


</body>


</html>
