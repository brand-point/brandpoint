<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Form</title>
    <style>
        body {
            
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        label {
            font-size: 16px;
            color: #555;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Contact Us</h1>
        <form id="contactForm" action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSf-wpporoSO1WLYI8m4C7WxaW3Oef8yvLkzA_WbcnIG3DHtZQ/formResponse" method="POST">
            
            <input type="text" id="name" name="entry.102685008" placeholder="* Name" required autocomplete="name" >
            <input type="email" id="email" name="entry.916366651" placeholder="* Email" required autocomplete="email">
            <input type="tel" id="mobile" name="entry.515368400" placeholder="* 10 Digit Mobile Number" pattern="[0-9]{10}" required  autocomplete="mobile">
            <textarea id="message" name="entry.1864843199" placeholder="Message / Query" rows="3"></textarea>
           <label for="image">Upload Image (optional)</label>
            <input type="file" id="image" name="entry.682503364" accept="image/*">
            <button type="submit">Submit</button>

            <p id="error" class="error"></p>
        </form>
    </div>

    <!-- Updated code: -->
<script>
    document.getElementById('contactForm').addEventListener('submit', function(event) {
        event.preventDefault();  // Keep this only if you're handling the form manually.

        const form = event.target;
        const name = form.name.value;
        const email = form.email.value;
        const mobile = form.mobile.value;
        const message = form.message.value;
        const image = form.image.files[0];

        // Validation: Check if all required fields are filled
        if (!name || !email || !mobile || !message) {
            document.getElementById('error').textContent = "All fields except image are required!";
            return;
        }

        document.getElementById('error').textContent = "";

        // Prepare FormData for file upload and other form fields
        const formData = new FormData();
        formData.append('entry.102685008', name);  // Replace with actual entry ID
        formData.append('entry.916366651', email);  // Replace with actual entry ID
        formData.append('entry.515368400', mobile);  // Replace with actual entry ID
        formData.append('entry.1864843199', message);  // Replace with actual entry ID

        if (image) {
            formData.append('entry.682503364', image);  // Replace with actual entry ID for file upload
        }

        // Submit the data via fetch (Ensure you replace YOUR_SCRIPT_ID with the actual ID)
        fetch('https://script.google.com/macros/s/AKfycbyJYRRx4K1QfUfBCu1oYtEWK0FBpzGaBSePJIvYwn5nkQqpBf7Fau1FhYcligI9iVqn/exec', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert("Form submitted successfully!");
                form.reset();
            } else {
                alert("Something went wrong, please try again.");
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("There was an error submitting the form.");
        });
    });

       


</script>




</body>
</html>
